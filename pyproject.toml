[project]
name = "awesome-claude"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hexiaofa", email = "hexiaofa@xiaomi.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0.0",
    "python-dotenv>=1.2.3",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"
